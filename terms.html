  <!-- Rezgo default template theme (from original inline <style>) -->
  <style>
    :root {
      --transition: 0.3s ease all;
      --default-box-shadow: rgb(0 0 0 / 12%) 0px 6px 10px;
      --subtle-gray: rgba(0,0,0,0.03);
      --header-gray: hsl(210, 0%, 33%);
      --subheader-gray: hsl(210, 0%, 55%);
      --hover-text-color: rgba(0,0,0,0.65);
      --kumbh: 'Kumbh Sans', sans-serif;
      --rezgo-orange: #ff6a0e;
      --rezgo-teal: #007F82;
      --navy-blue: #0D4191;
      --blue: #003366;
      --green: #398439;
      --yellow: #FF9900;
      --red: #CC0000;
      --dark-red: #990000;
    }
    body { font-family: var(--kumbh); margin-top: 100px; }
    .container { width: auto; padding: 5px 15px; }
    #rezgo-default-header { box-shadow: var(--default-box-shadow); padding: 3px 0 0px; }
    .navbar-header { display: flex; align-items: center; }
    .navbar-expand-lg .navbar-collapse { flex-basis: 100%; }
    #rezgo-default-header .rezgo-default-brand {
      font-size: 24px; font-weight: 600; color: #333; white-space: nowrap;
      overflow: hidden; transition: var(--transition); padding: 15px 0;
      overflow-x: hidden; width: 80%;
    }
    .navbar-company-logo { height: auto; padding: 0; }
    .navbar-toggle { margin-left: auto; }
    .company-logo-img { width: 100%; height: auto; object-fit: contain; max-width: 130px; aspect-ratio: 2 / 1; }
    #rezgo-default-header .rezgo-default-brand:hover { opacity: 0.70; }
    .rezgo-default-list-items { font-size: 15px; font-weight: 600; padding: 5px 15px 5px 0; }
    .rezgo-default-wrapper { max-width:1170px; margin:0 auto; }
    footer {
      padding: 15px 0 5px; background-color: #f5f5f5;
      border-top: 1px solid #e7e7e7; border-bottom: 1px solid #e7e7e7; font-size: 14px;
    }
    .rezgo-footer-brand, .rezgo-footer-brand a {
      font-weight: 600; color: #333; transition: var(--transition); text-decoration: none;
    }
    .rezgo-footer-brand a:hover { opacity: 0.70; text-decoration: none; }
    .rezgo-default-footer-copyright { font-size: 20px; margin-right: 3px; }
    .rezgo-default-footer-separator {
      display: inline-block; font-size: 20px; margin: 0 10px; color: #555;
      transform: scale(1.4); transform-origin: center;
    }
    @media (min-width: 768px){
      .rezgo-default-wrapper { display: flex; align-items: center; }
      .navbar-collapse { margin-left: auto!important; }
    }
    @media (min-width: 768px){
      .navbar>.container .navbar-brand { margin-left: 0; }
    }
    @media only screen and (min-device-width : 320px) and (max-device-width : 480px) {
      #rezgo-default-header .rezgo-default-brand { text-overflow: ellipsis; width: 70%; font-size: 20px; }
    }
  </style>
  <style>
    /* Change button label of 'more detail' on list page */
    .rezgo-btn-detail span { display:none; }
    .rezgo-btn-detail:after { content: 'Book Now'; }
  </style>
